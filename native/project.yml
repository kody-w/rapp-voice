name: RAPPVoice
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  RAPPDesktopSupport:
    url: https://github.com/kody-w/rapp-tools.git
    revision: f0bc616c2aed34f2a88888806ed056ec7bafba61
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "arm64 x86_64"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "111"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  RAPPVoiceCore:
    type: framework
    platform: macOS
    sources:
      - Sources/RAPPVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.voice.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  RAPPVoice:
    type: application
    platform: macOS
    sources:
      - path: Sources/RAPPVoice
        excludes:
          - Resources
      - path: Sources/RAPPVoice/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: RAPPVoiceCore
      - package: RAPPDesktopSupport
        product: RAPPDesktopSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.voice
        PRODUCT_NAME: RAPPVoice
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Signing/RAPPVoice.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  RAPPVoiceCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/RAPPVoiceCoreTests
        excludes:
          - Fixtures
      - path: Tests/RAPPVoiceCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: RAPPVoiceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.voice.coretests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RAPPVoice:
    build:
      targets:
        RAPPVoice: all
        RAPPVoiceCoreTests: [test]
    test:
      targets:
        - RAPPVoiceCoreTests
